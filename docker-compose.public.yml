services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wsc-authentication
    environment:
      WSC_BRIDGE_DOMAIN: ${WSC_BRIDGE_DOMAIN:?Set WSC_BRIDGE_DOMAIN to a DNS name pointing at this host}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for HTTPS certificate registration}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - wsc_caddy_data:/data
      - wsc_caddy_config:/config

volumes:
  wsc_caddy_data:
  wsc_caddy_config:
