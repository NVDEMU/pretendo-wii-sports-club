name: Go build checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - wsc-authentication
          - wsc-secure
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test and compile
        working-directory: ${{ matrix.module }}
        run: go test ./...

  python-dns-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test DNS packet parsing
        run: python -m unittest discover -s scripts/tests -v

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          KERBEROS_PASSWORD: ci-only-placeholder
          SECURE_SERVER_LOCATION: localhost
        run: docker compose config --quiet
      - name: Build authentication image
        run: docker build -t wsc-authentication ./wsc-authentication
      - name: Build secure-server image
        run: docker build -t wsc-secure ./wsc-secure
