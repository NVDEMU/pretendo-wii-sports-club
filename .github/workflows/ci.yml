name: WSC Build & Integration Tests (browser-run)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - wsc-authentication
          - wsc-secure
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test and compile
        working-directory: ${{ matrix.module }}
        run: go test ./...

  python-dns-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate browser and cloud bootstrap configuration
        run: |
          bash -n scripts/macos-local-start.sh
          bash -n deploy/oci-wsc-bootstrap.sh
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import pathlib
          import subprocess
          import yaml

          config = yaml.safe_load(pathlib.Path("deploy/digitalocean-cloud-init.yaml").read_text())
          files = {entry["path"]: entry["content"] for entry in config.get("write_files", [])}
          for path in ("/usr/local/sbin/wsc-bootstrap", "/usr/local/sbin/wsc-update-containers"):
              if path not in files:
                  raise SystemExit(f"cloud-init does not define {path}")
              subprocess.run(["bash", "-n"], input=files[path], text=True, check=True)
          print("Cloud-init YAML and embedded shell scripts are valid.")
          PY
      - name: Test DNS packet parsing
        run: python -m unittest discover -s scripts/tests -v

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate local Compose configuration
        env:
          KERBEROS_PASSWORD: ci-only-placeholder
          SECURE_SERVER_LOCATION: localhost
        run: docker compose config --quiet
      - name: Validate cloud runtime Compose configuration
        env:
          KERBEROS_PASSWORD: ci-only-placeholder
          WSC_NEX_PASSWORD_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SECURE_SERVER_LOCATION: localhost
        run: docker compose -f docker-compose.cloud.yml config --quiet
      - name: Build authentication image
        run: docker build -t wsc-authentication ./wsc-authentication
      - name: Build secure-server image
        run: docker build -t wsc-secure ./wsc-secure
      - name: Build single-container Docker Desktop bundle
        run: docker build -f deploy/Dockerfile.desktop -t wsc-desktop:ci .
      - name: Smoke test single-container Docker Desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs wsc-desktop-smoke || true
            docker rm -f wsc-desktop-smoke >/dev/null 2>&1 || true
            docker volume rm wsc-desktop-smoke-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create wsc-desktop-smoke-data >/dev/null
          docker run -d --name wsc-desktop-smoke \
            --publish 127.0.0.1:16014:60014/udp \
            --publish 127.0.0.1:16015:60015/udp \
            --volume wsc-desktop-smoke-data:/data \
            --env KERBEROS_PASSWORD=ci-only-local-test-secret \
            --env WSC_NEX_PASSWORD_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --env SECURE_SERVER_LOCATION=localhost \
            wsc-desktop:ci
          ready=false
          for attempt in $(seq 1 90); do
            state="$(docker inspect --format '{{.State.Status}}' wsc-desktop-smoke)"
            if [[ "$state" == "exited" ]]; then
              echo "Desktop bundle exited during startup" >&2
              exit 1
            fi
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' wsc-desktop-smoke)"
            if [[ "$health" == "healthy" ]]; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Desktop bundle did not become healthy" >&2
            docker logs wsc-desktop-smoke || true
            exit 1
          fi
          echo "PASS: MongoDB and both WSC server processes are healthy in the single-container GUI bundle."

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure disposable smoke-test deployment
        shell: bash
        run: |
          set -euo pipefail
          export WSC_INTERNAL_API_TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          KERBEROS_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          cat > .env <<EOF
          KERBEROS_PASSWORD=${KERBEROS_PASSWORD}
          SECURE_SERVER_LOCATION=wsc-smoke.example.invalid
          SECURE_SERVER_PORT=60015
          WSC_INTERNAL_API_TOKEN=${WSC_INTERNAL_API_TOKEN}
          NEX_AUTH_PUBLIC_HOST=wsc-smoke.example.invalid
          NEX_AUTH_PUBLIC_PORT=60014
          MONGO_URI=mongodb://mongo:27017/
          NEX_ACCOUNTS_DATABASE=wsc
          NEX_ACCOUNTS_COLLECTION=nexaccounts
          EOF
          docker compose -p wsc-smoke up --build -d
          echo "WSC_INTERNAL_API_TOKEN=$WSC_INTERNAL_API_TOKEN" >> "$GITHUB_ENV"

      - name: Exercise bridge against real MongoDB container
        run: |
          docker run --rm --network wsc-smoke_default \
            -v "$GITHUB_WORKSPACE/scripts/smoke_test_internal_bridge.py:/smoke.py:ro" \
            -e WSC_INTERNAL_API_TOKEN="$WSC_INTERNAL_API_TOKEN" \
            python:3.12-alpine python /smoke.py \
              --host wsc-smoke.example.invalid --port 60014

      - name: Stop smoke-test deployment
        if: always()
        run: |
          docker compose -p wsc-smoke down --volumes --remove-orphans || true
          rm -f .env
