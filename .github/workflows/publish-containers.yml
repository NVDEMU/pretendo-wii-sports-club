name: Publish tested WSC containers

on:
  workflow_run:
    workflows:
      - WSC Build & Integration Tests (browser-run)
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./wsc-authentication
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-authentication
          - context: ./wsc-secure
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-secure
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip publishing if main has moved on
        id: current
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$CURRENT_SHA" == "$TESTED_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
            echo "Publishing tested main commit $TESTED_SHA"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale test result: main is $CURRENT_SHA, tested commit was $TESTED_SHA"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.is_current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.is_current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the tested image
        if: steps.current.outputs.is_current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:main
            ${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
