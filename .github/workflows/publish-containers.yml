name: Publish tested WSC containers

on:
  workflow_run:
    workflows:
      - WSC Build & Integration Tests (browser-run)
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./wsc-authentication
            file: ./wsc-authentication/Dockerfile
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-authentication
          - context: ./wsc-secure
            file: ./wsc-secure/Dockerfile
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-secure
          - context: .
            file: ./deploy/Dockerfile.desktop
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-desktop
    steps:
      - name: Check out the tested commit or selected main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Skip publishing if main has moved on
        id: current
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$CURRENT_SHA" == "$TESTED_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
            echo "Publishing tested main commit $TESTED_SHA"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale test result: main is $CURRENT_SHA, selected commit was $TESTED_SHA"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.is_current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.is_current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the tested image to GHCR
        if: steps.current.outputs.is_current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:main
            ${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check whether Docker Hub publishing is configured
        id: dockerhub
        if: >-
          ${{ steps.current.outputs.is_current == 'true' &&
              matrix.image == 'ghcr.io/nvdemu/pretendo-wii-sports-club-desktop' }}
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub publishing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub publishing is skipped; repository secrets have not been configured."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the GUI bundle to Docker Hub
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.desktop
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pretendo-wii-sports-club-desktop:main
            ${{ secrets.DOCKERHUB_USERNAME }}/pretendo-wii-sports-club-desktop:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
