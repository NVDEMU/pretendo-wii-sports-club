name: Publish tested WSC containers

on:
  workflow_run:
    workflows:
      - WSC Build & Integration Tests (browser-run)
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./wsc-authentication
            file: ./wsc-authentication/Dockerfile
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-authentication
          - context: ./wsc-secure
            file: ./wsc-secure/Dockerfile
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-secure
          - context: .
            file: ./deploy/Dockerfile.desktop
            image: ghcr.io/nvdemu/pretendo-wii-sports-club-desktop
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip publishing if main has moved on
        id: current
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$CURRENT_SHA" == "$TESTED_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
            echo "Publishing tested main commit $TESTED_SHA"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale test result: main is $CURRENT_SHA, selected commit was $TESTED_SHA"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.is_current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.is_current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the tested image to GHCR
        if: steps.current.outputs.is_current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:main
            ${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Check whether Docker Hub publishing is configured
        id: dockerhub
        if: >-
          ${{ steps.current.outputs.is_current == 'true' &&
              matrix.image == 'ghcr.io/nvdemu/pretendo-wii-sports-club-desktop' }}
        shell: bash
        env:
          DOCKERHUB_USERNAME: nvd123yt
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub publishing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub publishing is skipped; add the Docker Hub access token as secret DOCKERHUB_TOKEN."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: nvd123yt
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the GUI bundle to Docker Hub
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.desktop
          push: true
          tags: |
            nvd123yt/pretendo-wii-sports-club-desktop:main
            nvd123yt/pretendo-wii-sports-club-desktop:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Verify Docker Hub image access and publish its direct link
        if: steps.dockerhub.outputs.ready == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: nvd123yt
          DOCKERHUB_PUBLIC_USERNAME: nvd123yt
        run: |
          set -uo pipefail
          image="${DOCKERHUB_USERNAME}/pretendo-wii-sports-club-desktop:main"
          {
            printf '%s\n' '### Docker Desktop download'
            if [[ -n "$DOCKERHUB_PUBLIC_USERNAME" ]]; then
              url="https://hub.docker.com/r/${DOCKERHUB_PUBLIC_USERNAME}/pretendo-wii-sports-club-desktop"
              printf '%s\n' "- [Open the published Docker Hub image]($url)"
              printf '%s\n' "- Exact image name: ${DOCKERHUB_PUBLIC_USERNAME}/pretendo-wii-sports-club-desktop:main"
            else
              printf '%s\n' '- Open Docker Hub → My Hub → Repositories → pretendo-wii-sports-club-desktop. The image username is still taken from the existing username secret; add the optional DOCKERHUB_USERNAME variable only if you want a direct link in this summary.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Use an empty Docker config so this is a real anonymous layer pull,
          # not a manifest inspection that might accidentally reuse login state.
          anonymous_config="$(mktemp -d)"
          export DOCKER_CONFIG="$anonymous_config"
          if docker pull "$image"; then
            echo "Anonymous Docker Hub pull verified: $image"
            printf '%s\n' '- Anonymous Docker Hub image pull: **passed**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Anonymous Docker Hub pull failed for $image. Confirm the repository is Public and that the main tag exists under nvd123yt."
            printf '%s\n' '- Anonymous Docker Hub image pull: **FAILED**. The image is not anonymously downloadable; check repository visibility, namespace, and the main tag.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
